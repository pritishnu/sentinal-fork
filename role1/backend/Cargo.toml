[package]
name = "sentinel-fork-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
alloy-primitives = "0.8"
sentinel-fork-decoder = { path = "../../role2/backend" }
axum = "0.7"
hex = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "time", "net"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

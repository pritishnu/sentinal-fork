<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Intercept and simulate Sepolia wallet requests before MetaMask opens." />
    <title>Sentinel Fork — Sepolia Security Lab</title>
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Instrument+Serif:ital@0;1&family=Fira+Code:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body, #root { min-height: 100%; margin: 0; background: #05050f; color: #f0eef8; }
      #sentinel-boot { box-sizing: border-box; min-height: 100vh; display: grid; place-items: center; padding: 2rem; font: 14px/1.6 system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"><div id="sentinel-boot">Loading Sentinel Fork…</div></div>
    <script>
      (() => {
        const showBootFailure = (detail) => {
          const boot = document.getElementById('sentinel-boot');
          if (!boot) return;
          boot.innerHTML = '<div><strong>Sentinel Fork could not start.</strong><br>' +
            String(detail || 'The browser blocked the application script.') +
            '<br><br>Open http://127.0.0.1:5173 directly and check the browser console.</div>';
        };
        window.__sentinelShowBootFailure = showBootFailure;
        window.addEventListener('error', (event) => {
          if (event instanceof ErrorEvent) showBootFailure(event.message);
        });
        window.addEventListener('unhandledrejection', (event) => {
          const reason = event.reason instanceof Error ? event.reason.message : event.reason;
          showBootFailure(reason);
        });
        window.setTimeout(() => {
          if (document.getElementById('sentinel-boot')) {
            showBootFailure('The browser did not execute the Vite module.');
          }
        }, 20000);
      })();
    </script>
    <script type="module">
      import('/src/main.tsx?sentinel-entry=2').catch((error) => {
          window.__sentinelShowBootFailure(error instanceof Error ? error.message : String(error));
      });
    </script>
  </body>
</html>
